name: publish

# Builds the image for linux/amd64 and linux/arm64, pushes it to ghcr.io and attests it.
# Called by ci.yml (edge, on every push to main) and release.yml (a version tag).
on:
  workflow_call:
    inputs:
      release:
        description: true for a version tag (X.Y.Z, X.Y, latest); false for main (edge, sha-<short>)
        type: boolean
        required: true
    outputs:
      digest:
        description: The digest of the pushed image index
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version the app reports
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "${{ inputs.release }}" = true ]; then
            echo "version=$pkg" >> "$GITHUB_OUTPUT"
          else
            echo "version=$pkg+edge.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR shows a multi-platform image's description from the index annotations;
          # Renovate and Dependabot read the labels. Both are set.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          # No bare major tag while the version is 0.x: 0 would float across breaking
          # minors. Add type=semver,pattern={{major}} at 1.0.0.
          tags: |
            type=semver,pattern={{version}},enable=${{ inputs.release }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.release }}
            type=edge,branch=main,enable=${{ !inputs.release }}
            type=sha,prefix=sha-,enable=${{ !inputs.release }}
          labels: |
            org.opencontainers.image.title=shipshape
            org.opencontainers.image.description=Docker Compose image updates for a homelab kept in git: reads the changelog, ships what nothing holds back, deploys, verifies and rolls back.
            org.opencontainers.image.url=https://justmytwospence.github.io/shipshape/
            org.opencontainers.image.documentation=https://justmytwospence.github.io/shipshape/
            org.opencontainers.image.licenses=FSL-1.1-ALv2
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            org.opencontainers.image.title=shipshape
            org.opencontainers.image.description=Docker Compose image updates for a homelab kept in git: reads the changelog, ships what nothing holds back, deploys, verifies and rolls back.
            org.opencontainers.image.url=https://justmytwospence.github.io/shipshape/
            org.opencontainers.image.documentation=https://justmytwospence.github.io/shipshape/
            org.opencontainers.image.licenses=FSL-1.1-ALv2
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
            type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

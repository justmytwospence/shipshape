<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fonts for the screenshot browser.

  The app asks for the system UI stack (-apple-system, Segoe UI, Roboto), none of which
  exist in a container. Left to itself, alpine-chrome resolves every one of them, and the
  generic sans-serif, to WenQuanYi Zen Hei: a CJK face whose Latin glyphs are wide and
  near-uniform in width. Text then photographs as though it were letter-spaced and
  justified, and every judgement made from that screenshot is about the font rather than
  the page.

  Bind this over /etc/fonts/local.conf in the screenshot container. Note that XML
  comments cannot contain a double hyphen; an invalid file is ignored silently, which is
  its own way to waste an afternoon.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Open Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Open Sans</family></prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer><family>Open Sans</family></prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer><family>Open Sans</family></prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer><family>Open Sans</family></prefer>
  </alias>
  <alias>
    <family>Segoe UI</family>
    <prefer><family>Open Sans</family></prefer>
  </alias>
  <alias>
    <family>Roboto</family>
    <prefer><family>Open Sans</family></prefer>
  </alias>
  <alias>
    <family>Helvetica Neue</family>
    <prefer><family>Open Sans</family></prefer>
  </alias>
  <alias>
    <family>Arial</family>
    <prefer><family>Open Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family><family>Liberation Mono</family></prefer>
  </alias>

  <!-- The condensed cuts must never stand in for the regular one. -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Open Sans Condensed</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>

# shipshape behind Caddy with forward-auth: sign-in is your auth server's.
#
# Caddy terminates TLS, asks the auth server about every request and forwards the
# signed-in user in Remote-User (see Caddyfile). shipshape believes that header only from
# Caddy's fixed address on `shipshape-proxy`, a network nothing else joins; shipshape
# publishes no port.
#
#   1. cp .env.example .env and fill it in; mkdir -p data
#   2. Caddy must reach your auth server at AUTH_UPSTREAM: add the auth server's network
#      to the caddy service below, or run the auth server in this file
#   3. docker compose up -d
#
# Guide: https://justmytwospence.github.io/shipshape/guides/reverse-proxy/
name: shipshape

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SHIPSHAPE_HOST: ${SHIPSHAPE_HOST:?set SHIPSHAPE_HOST in .env}
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-authelia:9091}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      shipshape-proxy:
        ipv4_address: 172.31.251.2
      default:

  shipshape:
    image: ghcr.io/justmytwospence/shipshape:0.2
    container_name: shipshape
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env (stat -c %g /var/run/docker.sock)}"
    env_file: .env
    environment:
      # Caddy's fixed address on shipshape-proxy: the only peer allowed to name a user.
      SHIPSHAPE_TRUSTED_PROXY: 172.31.251.2
      SHIPSHAPE_ALLOWED_USER: ${SHIPSHAPE_ALLOWED_USER:?set SHIPSHAPE_ALLOWED_USER in .env}
      SHIPSHAPE_ALLOWED_ORIGIN: https://${SHIPSHAPE_HOST}
    volumes:
      - ${REPO_DIR:?set REPO_DIR in .env}:${REPO_DIR}
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      shipshape-proxy:  # Caddy reaches shipshape here
      default:          # registries, GitHub and the model provider
    stop_grace_period: 15s

networks:
  shipshape-proxy:
    name: shipshape-proxy
    ipam:
      config:
        - subnet: 172.31.251.0/29

volumes:
  caddy-data:
